name: ch01 giai phau
on:
  push:
    branches: [ch01-workflow]
  workflow_dispatch:
jobs:
  xem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Ai kich hoat toi
        run: |
          echo "su kien : $GITHUB_EVENT_NAME"
          echo "ref     : $GITHUB_REF"
          echo "sha     : $GITHUB_SHA"
          echo "may     : $RUNNER_NAME ($RUNNER_OS, $ImageOS $ImageVersion)"
          node --version
