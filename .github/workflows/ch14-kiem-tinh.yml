# Chuong 14.2 — kiem tinh workflow: actionlint + zizmor (SARIF -> code scanning).
name: ch14-kiem-tinh
on:
  push:
    branches: [ch14-chat-luong]
  pull_request:
    branches: [ch14-chat-luong]
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Tai actionlint 1.7.12 va KIEM checksum
        run: |
          V=1.7.12
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz"
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_checksums.txt"
          sha256sum --ignore-missing -c "actionlint_${V}_checksums.txt"
          tar xzf "actionlint_${V}_linux_amd64.tar.gz" actionlint
      - name: actionlint
        run: ./actionlint -color .github/workflows/ch14-*.yml

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write   # de day SARIF len tab Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: zizmor (in ra log)
        run: pipx run zizmor==1.30.1 --offline .github/workflows/ch14-*.yml
        continue-on-error: true
      - name: zizmor (SARIF)
        run: pipx run zizmor==1.30.1 --offline --format sarif .github/workflows/ch14-*.yml > zizmor.sarif || true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor
