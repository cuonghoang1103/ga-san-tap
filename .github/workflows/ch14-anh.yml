# Chuong 14.3 — day anh nho len GHCR + goi npm len GitHub Packages bang GITHUB_TOKEN, roi ky attestation.
name: ch14-anh
on:
  push:
    branches: [ch14-phat-hanh]
permissions: {}
env:
  ANH: ghcr.io/cuonghoang1103/ga-san-tap
jobs:
  dung-anh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write          # day len GHCR
      id-token: write          # xin chung chi Sigstore qua OIDC
      attestations: write      # luu attestation
      artifact-metadata: write # storage record
    outputs:
      digest: ${{ steps.dung.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: dung
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ch14/anh
          push: true
          tags: ${{ env.ANH }}:ch14-anh-${{ github.run_number }}
          build-args: PHIEN_BAN=ch14-anh-${{ github.run_number }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.ANH }}
          subject-digest: ${{ steps.dung.outputs.digest }}
          push-to-registry: true

  kiem-anh:
    needs: dung-anh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: gh attestation verify (anh)
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.dung-anh.outputs.digest }}
        run: |
          gh attestation verify "oci://$ANH@$DIGEST" --repo "$GITHUB_REPOSITORY"
      - name: Chay anh vua keo ve
        env:
          DIGEST: ${{ needs.dung-anh.outputs.digest }}
        run: docker run --rm "$ANH@$DIGEST"

  goi-npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Dat phien ban + dong goi
        working-directory: ch14/goi-npm
        env:
          SO: ${{ github.run_number }}
        run: |
          npm version "0.1.$SO" --no-git-tag-version
          npm pack
          sha256sum ./*.tgz
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ch14/goi-npm/*.tgz
      - name: npm publish len GitHub Packages
        working-directory: ch14/goi-npm
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish ./*.tgz
      - name: Kiem attestation cua tep .tgz, roi sua 1 byte va kiem lai
        working-directory: ch14/goi-npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=$(ls ./*.tgz)
          gh attestation verify "$F" --repo "$GITHUB_REPOSITORY"
          cp "$F" sua.tgz && printf 'x' >> sua.tgz
          gh attestation verify sua.tgz --repo "$GITHUB_REPOSITORY" || echo "=> tep bi sua: KHONG co attestation khop (dung nhu mong doi)"
