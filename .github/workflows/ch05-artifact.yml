# Chương 5 · bài 5.4 — artifact: nhiều file vs một tarball, tên trùng, overwrite, archive:false, tải giữa job.
name: ch05 · artifact
on:
  push:
    branches: [ch05-cache]
    paths: ['.github/workflows/ch05-artifact.yml']
  workflow_dispatch:
jobs:
  tao:
    runs-on: ubuntu-24.04
    outputs:
      id-cu: ${{ steps.tar.outputs.artifact-id }}
      id-moi: ${{ steps.ghide.outputs.artifact-id }}
    steps:
      - name: Sinh 5000 file giong-mot-phan (~30 MB) + mot tarball cung noi dung
        run: |
          mkdir -p nhieu
          python3 - <<'PY'
          import os, random
          random.seed(5)
          chung = ("export function helper(x) { return x * 2 }\n" * 40)
          for i in range(5000):
              rieng = "".join(random.choice("abcdefghijklmnopqrstuvwxyz0123456789 \n") for _ in range(3000))
              rac = os.urandom(600).hex()
              open(f"nhieu/f{i:04d}.js", "w").write(chung + rieng + rac)
          PY
          du -sh nhieu; ls nhieu | wc -l
          time tar -czf mot.tgz nhieu && ls -la mot.tgz
      - name: Tai len 5000 file
        uses: actions/upload-artifact@v7
        with: { name: nhieu-file, path: nhieu/, retention-days: 1 }
      - name: Tai len 1 tarball
        id: tar
        uses: actions/upload-artifact@v7
        with: { name: mot-tarball, path: mot.tgz, retention-days: 1 }
      - name: Tai len thang (archive false, v7)
        uses: actions/upload-artifact@v7
        with: { path: mot.tgz, archive: false, retention-days: 1 }
      - name: Tai len TRUNG TEN (co y do)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with: { name: mot-tarball, path: mot.tgz, retention-days: 1 }
      - name: Trung ten nhung overwrite true
        id: ghide
        uses: actions/upload-artifact@v7
        with: { name: mot-tarball, path: mot.tgz, retention-days: 1, overwrite: true }

  ma-tran:
    strategy:
      matrix: { n: [linux, windows, macos] }
    runs-on: ubuntu-24.04
    steps:
      - run: mkdir -p kq && echo "ket qua tu nhanh ${{ matrix.n }}" > kq/${{ matrix.n }}.txt
      - uses: actions/upload-artifact@v7
        with: { name: 'ket-qua-${{ matrix.n }}', path: kq/, retention-days: 1 }

  dung:
    needs: [tao, ma-tran]
    runs-on: ubuntu-24.04
    steps:
      - name: Tai 1 artifact theo ten
        uses: actions/download-artifact@v8
        with: { name: mot-tarball, path: ve/tar }
      - name: Tai 5000 file
        uses: actions/download-artifact@v8
        with: { name: nhieu-file, path: ve/nhieu }
      - name: Gom ba nhanh ma tran vao MOT thu muc
        uses: actions/download-artifact@v8
        with: { pattern: 'ket-qua-*', merge-multiple: true, path: ve/gom }
      - name: Tai theo ID CU (truoc overwrite)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with: { artifact-ids: '${{ needs.tao.outputs.id-cu }}', path: ve/theo-id-cu }
      - name: Tai theo ID MOI (sau overwrite)
        uses: actions/download-artifact@v8
        with: { artifact-ids: '${{ needs.tao.outputs.id-moi }}', path: ve/theo-id }
      - name: Xem
        run: |
          find ve -maxdepth 2 | sort | head -20
          ls ve/nhieu | wc -l
          cat ve/gom/*.txt
      - name: Tai ten KHONG TON TAI (co y do)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with: { name: khong-co-dau, path: ve/x }

  quyen-va-file-an:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p goi && printf '#!/bin/sh\necho chay duoc\n' > goi/chay.sh && chmod +x goi/chay.sh
          echo "gia-tri-thu-khong-that-123" > goi/.env-thu
          ls -la goi
      - uses: actions/upload-artifact@v7
        with: { name: goi-zip, path: goi/, retention-days: 1 }
      - run: tar -cf goi.tar goi
      - uses: actions/upload-artifact@v7
        with: { name: goi-tar, path: goi.tar, retention-days: 1 }
      - uses: actions/download-artifact@v8
        with: { name: goi-zip, path: ve-zip }
      - uses: actions/download-artifact@v8
        with: { name: goi-tar, path: ve-tar }
      - run: |
          echo "--- qua zip ---"; ls -la ve-zip
          echo "--- qua tar ---"; tar -xf ve-tar/goi.tar -C ve-tar && ls -la ve-tar/goi

  hinh-dang:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: ch05/app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: ch05/app/package-lock.json }
      - run: npm ci --no-audit --no-fund 2>&1 | tail -1
      - name: Dong goi node_modules thanh 1 file
        run: |
          echo "node_modules: $(du -sh node_modules | cut -f1), $(find node_modules -type f | wc -l) file"
          /usr/bin/time -f "tar+zstd: %e giay" tar -I 'zstd -3 -T0' -cf ../nm.tar.zst node_modules
          ls -la ../nm.tar.zst
      - name: Tai len node_modules NGUYEN CAY (28k file)
        uses: actions/upload-artifact@v7
        with: { name: nm-cay, path: ch05/app/node_modules/, retention-days: 1, include-hidden-files: true }
      - name: Tai len node_modules 1 file (archive false)
        uses: actions/upload-artifact@v7
        with: { path: ch05/nm.tar.zst, archive: false, retention-days: 1 }
