name: ch04 setup-node
on:
  push:
    branches: [ch04-action]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ch04/app/package-lock.json
      - name: Khoa cache va hashFiles
        run: |
          echo "cache-hit         = ${{ steps.node.outputs.cache-hit }}"
          echo "cache-primary-key = ${{ steps.node.outputs.cache-primary-key }}"
          echo "hashFiles(lock)   = ${{ hashFiles('ch04/app/package-lock.json') }}"
          echo "node $(node --version) tai $(which node)"
          echo "tool cache co san : $(ls /opt/hostedtoolcache/node | tr '\n' ' ')"
          echo "thu muc cache npm : $(npm config get cache)"
      - name: npm ci
        working-directory: ch04/app
        run: |
          time npm ci
          ls node_modules
  tai-ve:
    runs-on: ubuntu-24.04
    steps:
      - name: Node ban KHONG co san trong tool cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.10.0'
      - run: node --version && which node
