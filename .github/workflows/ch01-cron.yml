# Chuong 1 (bai 1.3): do do tre cua schedule. Se bi TAT (gh workflow disable) sau khi do xong.
name: ch01 cron moi 5 phut
on:
  schedule:
    - cron: '*/5 * * * *'           # UTC, moi 5 phut
    - cron: '50 17 * * *'           # 17:50 ... theo mui gio nao?
      timezone: 'Asia/Ho_Chi_Minh'  # = 10:50 UTC
  workflow_dispatch:
jobs:
  do:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "su kien  : $GITHUB_EVENT_NAME"
          echo "lich     : ${{ github.event.schedule }}"
          echo "gio chay : $(date -u +%H:%M:%S) UTC"
