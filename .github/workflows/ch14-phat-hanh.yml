# Chuong 14.3 — phat hanh: (1) gh release create bang tay, (2) semantic-release.
name: ch14-phat-hanh
on:
  push:
    branches: [ch14-phat-hanh]
permissions: {}
concurrency:
  group: ch14-phat-hanh      # hai lan phat hanh khong duoc dua nhau
  cancel-in-progress: false
jobs:
  gh-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write          # tao tag + release
    steps:
      - name: Tao tag va release bang gh (notes tu sinh)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ch14-v0.1.${{ github.run_number }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "ch14 ban thu $TAG" --generate-notes --prerelease
          gh release view "$TAG" --json tagName,name,isPrerelease,targetCommitish,url,body

  semantic-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write          # day tag + tao release
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # can TOAN BO lich su + tag de tinh phien ban
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          npx --yes -p semantic-release@25.0.9 -p @semantic-release/github@12.0.10
          semantic-release
