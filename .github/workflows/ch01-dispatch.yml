name: ch01 dispatch boolean
on:
  workflow_dispatch:
    inputs:
      bo_qua_test:
        type: boolean
        default: false
jobs:
  xem:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "inputs.bo_qua_test              = ${{ inputs.bo_qua_test }}"
          echo "github.event.inputs.bo_qua_test = ${{ github.event.inputs.bo_qua_test }}"
      - name: if inputs.bo_qua_test
        if: inputs.bo_qua_test
        run: echo "CHAY — inputs.bo_qua_test duoc coi la DUNG"
      - name: if github.event.inputs.bo_qua_test
        if: github.event.inputs.bo_qua_test
        run: echo "CHAY — github.event.inputs.bo_qua_test duoc coi la DUNG"
      - name: if github.event.inputs.bo_qua_test == 'true'
        if: github.event.inputs.bo_qua_test == 'true'
        run: echo "CHAY — so chuoi 'true'"
